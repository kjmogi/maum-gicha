<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마음 기차 말하기 여행</title>
<meta name="description" content="상황을 고르며 나의 말하기 색깔을 알아보는 국어 활동 (작품을 읽고 생각이나 느낌 나누기)">
<style>
:root{
  --bg:#fdf6ea; --paper:#fffdf8; --ink:#2e2a35; --sub:#6b6474; --line:#eadfcd;
  --a:#ec6a55; --a-soft:#fde3dc; --b:#4a8bd6; --b-soft:#dde9f9; --m:#3fa874; --m-soft:#dcf2e5;
  --gold:#f4b73f; --gold-soft:#fff1cf; --shadow:0 6px 0 rgba(80,60,30,.12);
  --r:22px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:18px;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(circle at 10% 15%,#fff3d8 0 120px,transparent 121px),radial-gradient(circle at 92% 80%,#e9f1fb 0 160px,transparent 161px);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
textarea,input{font:inherit;color:inherit}
.hide{display:none!important}

/* 머리 */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(253,246,234,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;background:none;border:0;padding:0}
.brand svg{width:40px;height:40px}
#steps{display:flex;gap:6px;margin:0 auto;flex-wrap:wrap}
#steps span{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:99px;background:#f3ead9;color:var(--sub);font-size:15px;font-weight:700}
#steps span i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:13px}
#steps span.on{background:var(--ink);color:#fff}
#steps span.on i{color:var(--ink)}
#steps span.done{background:var(--m-soft);color:#24774f}
#steps span.done i{background:var(--m);color:#fff}
.tools{display:flex;gap:6px}
.tbtn{border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:15px;font-weight:700}
.tbtn:hover{border-color:var(--ink)}

/* 본문 */
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:28px}
.center{text-align:center}
h1{font-size:40px;line-height:1.25;margin:8px 0 10px;letter-spacing:-.5px}
h2{font-size:28px;margin:0 0 8px;letter-spacing:-.3px}
h3{font-size:21px;margin:0 0 8px}
.lead{color:var(--sub);font-size:19px;margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:14px 30px;font-weight:800;font-size:20px;background:var(--ink);color:#fff;box-shadow:0 5px 0 #000;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #c98d1a}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.row.sb{justify-content:space-between}
.mt{margin-top:22px}

/* 말풍선 */
.guide{display:flex;gap:14px;align-items:flex-end;margin:0 auto 18px;max-width:640px;text-align:left}
.guide svg{flex:0 0 86px;width:86px;height:86px}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 16px;font-weight:600}
.bubble:before{content:"";position:absolute;left:-10px;bottom:18px;width:16px;height:16px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* 표지 */
.cover{text-align:center;padding:40px 28px}
.cover .train{width:100%;max-width:560px;height:auto;margin:0 auto 6px;display:block}
.badge{display:inline-block;background:var(--gold-soft);color:#8a5b00;border-radius:99px;padding:4px 14px;font-weight:800;font-size:15px}
input.name{font-size:26px;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:16px;padding:12px 16px;width:min(360px,100%);background:#fff}
input.name:focus,textarea:focus{outline:none;border-color:var(--b)}

/* 단계 소개 */
.stageNo{font-size:15px;font-weight:800;color:var(--sub);letter-spacing:2px}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.goals div{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:14px;font-weight:700}
.goals b{display:block;font-size:28px;line-height:1.2}

/* 역 진행 */
.stations{display:flex;gap:4px;align-items:center;margin-bottom:16px}
.stations .st{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:#f3ead9;color:var(--sub);font-weight:700;font-size:15px;min-width:0}
.stations .st .ic{font-size:20px}
.stations .st.on{background:var(--ink);color:#fff}
.stations .st.done{background:var(--m-soft);color:#24774f}
.stations .st span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pips i.done{background:var(--m)}
.pips i.on{background:var(--ink);transform:scale(1.25)}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.qtag{display:inline-block;background:var(--gold-soft);color:#8a5b00;border-radius:99px;padding:3px 12px;font-size:15px;font-weight:800}
.qnum{color:var(--sub);font-weight:700;font-size:15px}
.qtext{font-size:25px;font-weight:800;margin:6px 0 18px;line-height:1.45}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{position:relative;text-align:left;background:#fff;border:3px solid var(--line);border-radius:20px;padding:20px 20px 20px 20px;font-size:19px;font-weight:600;line-height:1.5;min-height:140px;box-shadow:var(--shadow);transition:transform .1s,border-color .1s}
.opt:hover{transform:translateY(-2px)}
.opt .k{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:900;margin-bottom:8px;color:#fff}
.opt.A .k{background:var(--a)} .opt.B .k{background:var(--b)}
.opt.A.sel{border-color:var(--a);background:var(--a-soft)}
.opt.B.sel{border-color:var(--b);background:var(--b-soft)}
.opt.dim{opacity:.45}
.strength{margin-top:18px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px}
.strength p{margin:0 0 10px;font-weight:700}
.sbtn{border:3px solid var(--line);background:#fff;border-radius:99px;padding:10px 22px;font-weight:800;font-size:18px}
.sbtn.sel{border-color:var(--ink);background:var(--ink);color:#fff}

/* 저울 게이지 */
.gauge{margin:8px auto 0;max-width:640px}
.gauge .bar{position:relative;height:22px;border-radius:99px;background:linear-gradient(90deg,var(--b) 0%,#9cc0ea 30%,var(--m) 50%,#f2a596 70%,var(--a) 100%)}
.gauge .mark{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2);transition:left .6s cubic-bezier(.3,1.6,.5,1)}
.gauge .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin-top:6px}
.gauge .lbl .l{color:var(--b)} .gauge .lbl .r{color:var(--a)} .gauge .lbl .c{color:var(--m)}
.mini{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--sub)}
.mini .gauge{flex:1;margin:0}
.mini .gauge .bar{height:12px}
.mini .gauge .mark{width:22px;height:22px;margin:-11px 0 0 -11px;border-width:3px}

/* 결과 */
.typeHero{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center}
.typeIcon{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;font-size:96px;border:6px solid #fff;box-shadow:0 0 0 4px var(--line)}
.typeName{font-size:38px;font-weight:900;margin:0;line-height:1.2}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px}
.box ul{margin:6px 0 0;padding-left:22px}
.box li{margin:4px 0}
.box.good{border-color:#bfe5cf} .box.good h3{color:#24774f}
.box.care{border-color:#f6d39a} .box.care h3{color:#a86b00}
.areaRow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;margin:10px 0}
.areaRow .n{font-weight:800}
.areaRow .gauge{margin:0;width:100%}
.areaRow small{grid-column:2;color:var(--sub);margin-top:-6px;font-size:15px}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.voice{border-radius:18px;padding:18px;font-weight:600}
.voice.a{background:var(--a-soft)} .voice.b{background:var(--b-soft)}
.voice b{display:block;margin-bottom:6px}
.voice p{margin:0}
.voice .note{margin-top:10px;font-size:15px;color:var(--sub);font-weight:600}
.mission{display:flex;gap:14px;align-items:center;background:var(--gold-soft);border-radius:18px;padding:16px 18px;font-weight:700}
.mission .ic{font-size:34px}

/* 쓰기 */
label.q{display:block;font-weight:800;font-size:19px;margin:18px 0 6px}
textarea,input.line{width:100%;border:3px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;font-size:18px;resize:vertical}
textarea{min-height:88px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px dashed #cdbfa6;background:#fffaf1;border-radius:99px;padding:5px 12px;font-size:15px;font-weight:700}
.chip:hover{border-style:solid;border-color:var(--ink)}
.hint{font-size:15px;color:var(--sub);margin:4px 0 0}

/* 말 연습 */
.scene{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.scene .ic{font-size:52px;flex:0 0 auto}
.scene p{margin:0;font-size:21px;font-weight:700}
.says{display:grid;gap:12px}
.say{text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px 18px;font-size:19px;font-weight:700;box-shadow:var(--shadow)}
.say:hover{border-color:var(--ink)}
.say.sel.both{border-color:var(--m);background:var(--m-soft)}
.say.sel.blunt{border-color:var(--a);background:var(--a-soft)}
.say.sel.hide{border-color:var(--b);background:var(--b-soft)}
.fb{margin-top:16px;border-radius:18px;padding:16px 18px;font-weight:700;display:flex;gap:12px;align-items:center}
.fb .ic{font-size:34px}
.fb.both{background:var(--m-soft);color:#1f6a45}
.fb.blunt{background:var(--a-soft);color:#9b3424}
.fb.hide{background:var(--b-soft);color:#235a98}
.formula{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.formula div{border-radius:16px;padding:12px;text-align:center;font-weight:800}
.formula div:nth-child(1){background:var(--a-soft)} .formula div:nth-child(2){background:var(--b-soft)} .formula div:nth-child(3){background:var(--m-soft)}
.formula small{display:block;font-weight:600;color:var(--sub);font-size:14px}
.preview{background:#fff;border:3px solid var(--m);border-radius:18px;padding:16px 18px;font-size:21px;font-weight:700;min-height:64px}
.preview.empty{color:#b9ae9c;border-style:dashed;border-color:var(--line)}

/* 결과지 */
.sheet{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:32px}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
.sheet .head h2{margin:0}
.sheet .sec{margin:16px 0}
.sheet .sec h3{font-size:18px;color:var(--sub);margin:0 0 6px}
.sheet .ans{background:#fbf7ef;border-radius:12px;padding:10px 14px;min-height:44px;white-space:pre-wrap}
.learned{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.learned div{background:var(--gold-soft);border-radius:14px;padding:12px;font-weight:700;font-size:16px}

/* 창 */
#modal{position:fixed;inset:0;background:rgba(30,25,35,.45);display:grid;place-items:center;z-index:50;padding:16px}
#modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}
#modal ol{padding-left:22px}
#modal li{margin:8px 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-weight:800;z-index:60;transition:transform .3s;pointer-events:none;white-space:nowrap}
#toast.on{transform:translateX(-50%) translateY(0)}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.fade{animation:fade .35s ease}
@keyframes fade{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:720px){
  body{font-size:17px}
  h1{font-size:30px} h2{font-size:24px}
  .card{padding:20px}
  .pick,.cols,.voices,.goals,.learned{grid-template-columns:1fr}
  .formula{grid-template-columns:1fr}
  .typeHero{grid-template-columns:1fr;text-align:center}
  .typeIcon{margin:0 auto;width:150px;height:150px;font-size:72px}
  .typeName{font-size:30px}
  .qtext{font-size:21px}
  .opt{min-height:0}
  .stations .st span.t{display:none}
  .stations .st{justify-content:center}
  .areaRow{grid-template-columns:1fr}
  .areaRow small{grid-column:1}
  #steps span{font-size:0;padding:4px}
  #steps span i{font-size:13px}
  .brand b{display:none}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:14px}
  #top,.noprint,#toast{display:none!important}
  main{padding:0;max-width:none}
  .sheet{border:0;padding:0}
  .card{box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top">
  <button class="brand" type="button" data-act="home" aria-label="처음 화면으로"><span id="brandBird"></span><b>마음 기차 말하기 여행</b></button>
  <nav id="steps" aria-label="진행 단계"></nav>
  <div class="tools">
    <button class="tbtn" type="button" data-act="help">활동 방법</button>
    <button class="tbtn" type="button" data-act="sound" id="soundBtn">소리 켬</button>
    <button class="tbtn" type="button" data-act="reset">새로 시작</button>
  </div>
</header>
<main id="app"></main>
<div id="modal" class="hide"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem">이 활동은 자바스크립트가 켜져 있어야 해요.</p></noscript>

<script>
/* ───────── 활동 내용 ─────────
   점수: A(바로 솔직하게 말하는 쪽) = +, B(마음을 살피며 참거나 돌려 말하는 쪽) = −
   “아주 그래요” = 2점, “조금 그래요” = 1점 → 총점 −32 ~ +32 */
const D = {
  areas: [
    { n: '말하기 역', ic: '💬', s: '내 마음 말하기',
      intro: '하고 싶은 말이 생겼을 때 나는 어떻게 하는지 떠올려 봐요.',
      hi: '하고 싶은 말을 바로 꺼내는 편이에요.', lo: '분위기를 살피며 말을 아끼는 편이에요.', mid: '말할 때와 기다릴 때를 고르는 편이에요.' },
    { n: '도움말 역', ic: '💡', s: '조언하기',
      intro: '친구에게 도움이 될 말이 떠올랐을 때 나는 어떻게 하는지 떠올려 봐요.',
      hi: '느낀 점을 바로 알려 주는 편이에요.', lo: '친구가 속상할까 봐 말을 삼키는 편이에요.', mid: '솔직함과 조심스러움 사이를 오가는 편이에요.' },
    { n: '지킴이 역', ic: '🛡️', s: '거절하고 지키기',
      intro: '싫은 부탁이나 옳지 않은 일을 만났을 때 나는 어떻게 하는지 떠올려 봐요.',
      hi: '싫은 것은 싫다고 분명하게 말하는 편이에요.', lo: '다툼이 생길까 봐 참는 편이에요.', mid: '말할 때와 참을 때를 나누는 편이에요.' },
    { n: '화해 역', ic: '🤝', s: '다툼과 화해',
      intro: '친구와 마음이 부딪혔을 때 나는 어떻게 하는지 떠올려 봐요.',
      hi: '먼저 말을 꺼내고 끝까지 이야기하는 편이에요.', lo: '맞춰 주거나 기다리는 편이에요.', mid: '다가가기도 하고 기다리기도 하는 편이에요.' }
  ],
  sit: [
    { a: 0, t: '점심시간 놀이', q: '친구들이 점심시간에 모두 피구를 하자고 해요. 나는 교실에서 그림을 그리고 싶어요.',
      A: '“나는 오늘 그림 그릴래. 다음에 같이 하자.”라고 바로 말한다.', B: '혼자 빠지면 어색할 것 같아서 그냥 따라 나간다.' },
    { a: 0, t: '모르는 내용', q: '수업 시간에 선생님 설명을 잘 이해하지 못했어요.',
      A: '손을 들고 “한 번 더 설명해 주세요.”라고 여쭤본다.', B: '나만 모르는 것 같아 창피해서 모르는 채로 넘어간다.' },
    { a: 0, t: '학급 회의', q: '학급 회의에서 좋은 생각이 떠올랐어요.',
      A: '생각이 떠오르면 바로 손을 들고 말한다.', B: '내 생각이 괜찮은지 망설이다가 말할 때를 놓친다.' },
    { a: 0, t: '가족 외식', q: '가족이 모두 피자를 먹자고 하는데, 나는 국수가 먹고 싶어요.',
      A: '“나는 국수가 먹고 싶어요.”라고 내 마음을 말한다.', B: '다들 좋아하니까 “나도 좋아.”라고 하고 따라간다.' },

    { a: 1, t: '발표 연습', q: '친구가 발표 연습을 보여 주는데, 목소리가 너무 작아서 잘 안 들려요.',
      A: '“목소리를 조금 더 크게 하면 좋겠어.”라고 바로 알려 준다.', B: '친구가 기운이 빠질까 봐 “잘했어.”라고만 말한다.' },
    { a: 1, t: '틀린 글자', q: '친구가 게시판에 붙일 글을 썼는데, 틀린 글자가 몇 개 보여요.',

    : '<circle cx="41" cy="47" r="4.2" fill="#2e2a35"/><circle cx="59" cy="47" r="4.2" fill="#2e2a35"/><circle cx="42.4" cy="45.6" r="1.4" fill="#fff"/><circle cx="60.4" cy="45.6" r="1.4" fill="#fff"/>';
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <ellipse cx="50" cy="94" rx="26" ry="4" fill="rgba(0,0,0,.08)"/>
    <path d="M18 62q-10 4-8 16 8-2 12-8z" fill="#f2a43a"/><path d="M82 62q10 4 8 16-8-2-12-8z" fill="#f2a43a"/>
    <circle cx="50" cy="58" r="33" fill="#ffc94d"/>
    <ellipse cx="50" cy="70" rx="20" ry="16" fill="#fff3d2"/>
    <circle cx="30" cy="58" r="5" fill="#ff9d8a" opacity=".6"/><circle cx="70" cy="58" r="5" fill="#ff9d8a" opacity=".6"/>
    ${eye}
    <path d="M45 55l5 7 5-7z" fill="#ec6a55"/>
    <path d="M22 34q28-22 56 0v6H22z" fill="#4a8bd6"/><rect x="18" y="37" width="64" height="7" rx="3.5" fill="#2f5f9e"/>
    <circle cx="50" cy="28" r="4.5" fill="#ffc94d" stroke="#2f5f9e" stroke-width="2"/>
    <path d="M44 88l-3 6M56 88l3 6" stroke="#f2a43a" stroke-width="4" stroke-linecap="round"/>
  </svg>`;
}
function guide(text, mood) { return `<div class="guide">${tori(mood)}<div class="bubble">${text}</div></div>`; }

/* 표지 기차 그림 */
function train() {
  const cars = [['#ec6a55', '💬'], ['#f4b73f', '💡'], ['#3fa874', '🛡️'], ['#4a8bd6', '🤝']];
  let x = 150, g = '';
  cars.forEach(([c, e]) => {
    g += `<g transform="translate(${x},70)"><rect width="88" height="60" rx="12" fill="${c}"/><rect x="12" y="12" width="64" height="26" rx="8" fill="#fff" opacity=".9"/>
      <text x="44" y="32" font-size="18" text-anchor="middle">${e}</text><circle cx="20" cy="64" r="9" fill="#2e2a35"/><circle cx="68" cy="64" r="9" fill="#2e2a35"/></g>`;
    x += 98;
  });
  return `<svg class="train" viewBox="0 0 560 150" aria-hidden="true">
    <path d="M0 144h560" stroke="#cdbfa6" stroke-width="4"/><path d="M10 144v-4M40 144v-4M70 144v-4M100 144v-4M130 144v-4M160 144v-4M190 144v-4M220 144v-4M250 144v-4M280 144v-4M310 144v-4M340 144v-4M370 144v-4M400 144v-4M430 144v-4M460 144v-4M490 144v-4M520 144v-4M550 144v-4" stroke="#cdbfa6" stroke-width="6"/>
    <g transform="translate(30,40)"><rect x="0" y="30" width="112" height="60" rx="14" fill="#2e2a35"/><rect x="58" y="0" width="54" height="54" rx="12" fill="#2e2a35"/>
      <rect x="68" y="10" width="34" height="24" rx="6" fill="#fff3d2"/><rect x="14" y="10" width="20" height="24" rx="4" fill="#2e2a35"/>
      <circle cx="24" cy="2" r="9" fill="#fff" opacity=".8"/><circle cx="8" cy="-10" r="7" fill="#fff" opacity=".6"/>
      <circle cx="28" cy="94" r="11" fill="#ec6a55"/><circle cx="84" cy="94" r="11" fill="#ec6a55"/>
      <g transform="translate(62,-30) scale(.46)">${tori('happy').replace(/<\/?svg[^>]*>/g, '')}</g></g>
    ${g}</svg>`;
}

function gauge(s, max, mini) {
  const p = Math.max(0, Math.min(100, (s + max) / (2 * max) * 100));
  return `<div class="gauge"><div class="bar"><div class="mark" style="left:${p}%"></div></div>${mini ? '' : '<div class="lbl"><span class="l">◀ 마음 살피기</span><span class="c">균형</span><span class="r">바로 말하기 ▶</span></div>'}</div>`;
}

/* ───────── 화면 ───────── */
const STEP_OF = { cover: 0, name: 0, intro: 0, q: 1, result: 2, story: 3, say: 4, mine: 4, final: 5 };
function curStep() { return S.phase === 'intro' ? S.stage : STEP_OF[S.phase]; }
function updateSteps() {
  const c = curStep();
  $('#steps').innerHTML = D.stages.map(s => `<span class="${s.n === c ? 'on' : S.done.includes(s.n) ? 'done' : ''}"><i>${S.done.includes(s.n) ? '✓' : s.n}</i>${s.t}</span>`).join('');
  $('#soundBtn').textContent = PREF.mute ? '소리 끔' : '소리 켬';
  $('#soundBtn').setAttribute('aria-pressed', String(!PREF.mute));
}

function mineSentence() { return [S.mine.c1, S.mine.c2, S.mine.c3].map(x => x.trim()).filter(Boolean).join(' '); }
function updatePreview() { const el = $('#preview'); if (!el) return; const t = mineSentence(); el.textContent = t || '세 조각을 쓰면 여기에 이어져요.'; el.classList.toggle('empty', !t); }

function render() {
  if (!V[S.phase]) S.phase = 'cover';
  $('#app').innerHTML = V[S.phase]();
  /* 같은 화면 안에서 고르기만 바뀐 경우에는 등장 효과를 다시 넣지 않음 */
  const key = S.phase + S.qi + '/' + S.si;
  if (key === render.last) document.querySelectorAll('#app .fade, #app .typeIcon.pop').forEach(el => el.classList.remove('fade', 'pop'));
  render.last = key;
  updateSteps();
  updatePreview();
  if (S.phase === 'name') setTimeout(() => { const n = $('#nameIn'); if (n) n.focus(); }, 50);
}

/* ───────── 창 ───────── */
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="card pop">${html}</div>`; m.classList.remove('hide'); }
function closeModal() { $('#modal').classList.add('hide'); $('#modal').innerHTML = ''; }
function finishStage(n, next) {
  if (!S.done.includes(n)) S.done.push(n);
  sfx.stamp(); save();
  modal(`<div class="center"><div style="font-size:72px" class="pop">🎫</div><h2>${n}단계 도장 쾅!</h2><p class="lead">${D.stages[n - 1].t}${D.stages[n - 1].j} 마쳤어요.</p><button class="btn gold" data-act="closeGo" data-next="${next}">다음으로 ▶</button></div>`);
}

/* ───────── 동작 ───────── */
const ACT = {
  home: () => { if (S.phase !== 'cover') S.resume = S.phase; go('cover'); },
  help: () => modal(`<h2>활동 방법</h2><ol>${D.help.map(([a, b]) => `<li><b>${a}</b><br>${b}</li>`).join('')}</ol><div class="row c"><button class="btn" data-act="close">알겠어요</button></div>`),
  sound: () => { PREF.mute = !PREF.mute; savePref(); updateSteps(); sfx.pick(); },
  reset: () => modal(`<div class="center"><h2>새로 시작할까요?</h2><p class="lead">지금까지의 기록이 모두 지워져요.</p><div class="row c"><button class="btn ghost" data-act="close">아니요</button><button class="btn" data-act="doReset">새로 시작</button></div></div>`),
  doReset: () => { closeModal(); S = fresh(); go('cover'); },
  close: closeModal,
  closeGo: el => { closeModal(); const nx = el.dataset.next; if (nx === 'final') { sfx.done(); go('final'); } else go('intro', { stage: +nx }); },
  toName: () => { sfx.pick(); go('name'); },
  continue: () => { sfx.pick(); go(S.resume || (S.name ? 'intro' : 'name'), { stage: S.stage || 1 }); },
  setName: () => { const v = ($('#nameIn').value || '').trim(); if (!v) { toast('이름을 먼저 써 주세요.'); $('#nameIn').focus(); return; } sfx.good(); go('intro', { name: v, stage: 1 }); },
  startStage: () => { sfx.pick(); go({ 1: 'q', 2: 'result', 3: 'story', 4: 'say' }[S.stage]); },
  choose: el => { const c = el.dataset.c, a = S.ans[S.qi] || {}; S.ans[S.qi] = { c, w: a.c === c ? a.w : 0 }; sfx.pick(); save(); render(); const s = $('#strength'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); },
  weight: el => { S.ans[S.qi].w = +el.dataset.w; sfx.tap(); save(); render(); },
  prevQ: () => { if (S.qi > 0) { S.qi--; save(); render(); } },
  nextQ: () => {
    const a = S.ans[S.qi]; if (!a || !a.c || !a.w) return;
    if (S.qi === 15) { finishStage(1, 2); return; }
    if (S.qi % 4 === 3) { sfx.stamp(); toast(`${D.areas[D.sit[S.qi].a].ic} ${D.areas[D.sit[S.qi].a].n} 통과! 다음 역으로 출발`); } else sfx.tap();
    S.qi++; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  redoQ: () => go('q', { qi: 0 }),
  toResult: () => go('result'),
  finishStage: el => { const n = +el.dataset.n; finishStage(n, n === 4 ? 'final' : n + 1); },
  chip: el => {
    const f = el.dataset.f, inp = document.querySelector(`[data-f="${f}"]:not(.chip)`); if (!inp) return;
    const t = el.dataset.t, i = t.indexOf('○○');
    inp.value = inp.value ? inp.value.replace(/\s*$/, ' ') + t : t; inp.focus();
    const at = i >= 0 ? inp.value.length - t.length + i : inp.value.length; inp.setSelectionRange(at, at + (i >= 0 ? 2 : 0));
    inp.dispatchEvent(new Event('input', { bubbles: true })); sfx.tap();
  },
  pickAsk: el => { S.story.ask = el.dataset.t; sfx.tap(); save(); render(); },
  sayPick: el => {
    const k = el.dataset.k; S.picks[S.si] = k; if (!S.first[S.si]) S.first[S.si] = k;
    k === 'both' ? sfx.good() : sfx.soft(); save(); render();
    const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  },
  prevSay: () => { if (S.si > 0) { S.si--; save(); render(); } },
  nextSay: () => { if (S.si < 3) { S.si++; sfx.tap(); go('say'); } else go('mine'); },
  backSay: () => go('say', { si: 3 }),
  speak: () => {
    const t = mineSentence(); if (!t) { toast('먼저 세 조각을 써 주세요.'); return; }
    if (!('speechSynthesis' in window)) { toast('이 기기에서는 읽어 주기를 쓸 수 없어요.'); return; }
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = .95; speechSynthesis.speak(u);
  },
  print: () => window.print()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) { ACT[el.dataset.act] && ACT[el.dataset.act](el); return; }
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  if (f in S.story) S.story[f] = e.target.value;
  else if (f in S.mine) { S.mine[f] = e.target.value; updatePreview(); }
  else if (f === 'opp') S.opp = e.target.value;
  save();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').classList.contains('hide')) closeModal();
  if (e.key === 'Enter' && e.target.id === 'nameIn') ACT.setName();
});
$('#brandBird').innerHTML = tori('happy');
render();
</script>
</body>
</html>
